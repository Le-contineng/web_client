name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
